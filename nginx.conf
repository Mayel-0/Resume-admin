# Nginx À L'INTÉRIEUR du conteneur : sert le build statique.
# Le Nginx du serveur (reverse proxy) reste devant et lui passe les requêtes.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Fichiers nommés avec un hash par Vite : cache longue durée
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html ne doit jamais rester en cache, sinon un nouveau
  # déploiement n'est pas vu par les visiteurs
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA : toute route inconnue (/login, /projects…) renvoie index.html,
  # React Router prend le relais
  location / {
    try_files $uri $uri/ /index.html;
  }
}
